<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Memo List</title>
        <link rel="stylesheet" href="../../styles/common.css">
        <link rel="stylesheet" href="../../styles/list.css">
    </head>
    <body>
        <div id="titlebar">
            <span>Sticky Markdown Note</span>
            <div>
                <button id="trash-button" class="title-btn" title="Recently Deleted" aria-label="Recently Deleted">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>
                    </svg>
                </button>
                <button id="settings-button" class="title-btn" title="Settings" aria-label="Settings">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
                <button id="close-window" class="title-btn close-btn" title="Close" aria-label="Close Memo List" onclick="window.close()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18"/><path d="M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Recently Deleted banner: shown instead of #toolbar/#filter-chips
             while the trash view is active (toggled via #trash-button).
             Hidden by default (see list.css). -->
        <div id="trash-banner" class="hidden">
            <button id="trash-back" class="title-btn" title="Back to notes" aria-label="Back to notes">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </button>
            <span>Recently Deleted <small>(kept 48h)</small></span>
        </div>

        <div id="filter-chips">
            <button class="chip" data-filter="pinned">Pinned</button>
            <button class="chip" data-filter="chatgpt">Sent to ChatGPT</button>
            <button class="chip chip-color" data-filter-color="yellow" data-color="yellow" title="Yellow" aria-label="Filter: yellow notes"></button>
            <button class="chip chip-color" data-filter-color="green" data-color="green" title="Green" aria-label="Filter: green notes"></button>
            <button class="chip chip-color" data-filter-color="blue" data-color="blue" title="Blue" aria-label="Filter: blue notes"></button>
            <button class="chip chip-color" data-filter-color="purple" data-color="purple" title="Purple" aria-label="Filter: purple notes"></button>
            <button class="chip chip-color" data-filter-color="pink" data-color="pink" title="Pink" aria-label="Filter: pink notes"></button>
            <button class="chip chip-color" data-filter-color="gray" data-color="gray" title="Gray" aria-label="Filter: gray notes"></button>
            <button class="chip chip-color" data-filter-color="charcoal" data-color="charcoal" title="Charcoal" aria-label="Filter: charcoal notes"></button>
        </div>
        <div id="toolbar">
            <button id="add" class="primary">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14"/><path d="M5 12h14"/>
                </svg>
                New note
            </button>
            <div class="search-wrap">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                </svg>
                <input id="search" type="text" placeholder="Search notes..." />
            </div>
        </div>
        <div id="notes"></div>

        <script src="../shared/toast.js"></script>
        <script src="list.js"></script>
    </body>
</html>
